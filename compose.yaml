services:
  db:
    image: postgres:17
    container_name: paprintco-db
    environment:
      POSTGRES_USER: paprintco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paprintco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paprintco -d paprintco"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: